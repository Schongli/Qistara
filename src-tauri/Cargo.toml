[package]
name = "qistara"
version = "0.3.0"
description = "Qistara: lossless music and media player"
authors = []
license = "MIT"
repository = "https://github.com/Schongli/Qistara"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "qistara_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-libmpv = "0.3.2"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-http = "2.9.0"
rusqlite = { version = "0.42.0", features = ["bundled"] }
lofty = "0.25.5"
walkdir = "2.5.0"
rayon = "1.12.0"
notify-debouncer-mini = "0.7.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
souvlaki = "0.9.3"
md5 = "0.8.1"
tauri-plugin-opener = "2.7.3"
# v1 picks the native store per OS: Credential Manager, macOS Keychain, Secret Service
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }
# Spotify sign-in (PKCE); all four were already in the build as dependencies of other crates
sha2 = "0.10"
base64 = "0.22"
flate2 = "1"
getrandom = "0.3"
url = "2"
# legacy text files (GBK / Shift-JIS lyrics, ANSI playlists); already in the build through reqwest
encoding_rs = "0.8.44"
# Apple Music developer tokens (ES256); already in the build through rustls
ring = "0.17"
# Japanese lyrics for learners: word splitting, readings and dictionary forms. The IPADIC dictionary is
# optional: Learn mode downloads and builds it on first use (japanese.rs), so the app doesn't carry ~46 MB.
lindera = "6.2"
# decoding recitations to find the pauses between ayahs (pure Rust)
symphonia = { version = "0.5", default-features = false, features = ["aac", "alac", "flac", "isomp4", "mp3", "wav", "pcm", "ogg", "vorbis"] }

[dev-dependencies]
tempfile = "3.27.0"

# decoding a two-hour recitation is slow unoptimised; build the decoders optimised in dev too
[profile.dev.package.symphonia-core]
opt-level = 3
[profile.dev.package.symphonia-bundle-flac]
opt-level = 3
[profile.dev.package.symphonia-codec-aac]
opt-level = 3
[profile.dev.package.symphonia-codec-alac]
opt-level = 3
[profile.dev.package.symphonia-bundle-mp3]
opt-level = 3
[profile.dev.package.symphonia-format-isomp4]
opt-level = 3
