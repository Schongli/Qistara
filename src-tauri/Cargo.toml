[package]
name = "sonora"
version = "0.1.0"
description = "Apple-style lossless music and media player"
authors = []
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "sonora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-libmpv = "0.3.2"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-http = "2.9.0"
rusqlite = { version = "0.42.0", features = ["bundled"] }
lofty = "0.25.5"
walkdir = "2.5.0"
rayon = "1.12.0"
notify-debouncer-mini = "0.7.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
souvlaki = "0.9.3"
md5 = "0.8.1"
tauri-plugin-opener = "2.7.3"
keyring = { version = "4.2.0", default-features = false, features = ["v1", "windows-native-keyring-store"] }
# Spotify sign-in (PKCE); all four were already in the build as dependencies of other crates
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
url = "2"
# Japanese lyrics for learners: word splitting, readings and dictionary forms. The IPADIC dictionary is
# downloaded once at build time (md5-checked) and embedded: ~46 MB in the app, ~7 MB in the installer.
lindera = { version = "6.2", features = ["embed-ipadic"] }

[dev-dependencies]
tempfile = "3.27.0"
