[package]
name = "sonora"
version = "0.1.0"
description = "Apple-style lossless music and media player"
authors = []
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "sonora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-libmpv = "0.3.2"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-http = "2.9.0"
rusqlite = { version = "0.42.0", features = ["bundled"] }
lofty = "0.25.5"
walkdir = "2.5.0"
rayon = "1.12.0"
notify-debouncer-mini = "0.7.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
souvlaki = "0.9.3"
md5 = "0.8.1"
tauri-plugin-opener = "2.7.3"
keyring = { version = "4.2.0", default-features = false, features = ["v1", "windows-native-keyring-store"] }

[dev-dependencies]
tempfile = "3.27.0"
