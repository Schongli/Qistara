name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: TypeScript (check + vitest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx vitest run

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libdbus-1-dev build-essential pkg-config
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # bundle.resources is lib/**/*: the glob must match something for tauri-build
      - name: libmpv (Windows)
        if: runner.os == 'Windows'
        run: npx tauri-plugin-libmpv-api setup-lib
      - name: libmpv placeholder (Linux, macOS use the system libmpv)
        if: runner.os != 'Windows'
        run: mkdir -p src-tauri/lib && touch src-tauri/lib/.placeholder
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test --lib --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings

  bundle:
    name: Windows installer
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [web, rust]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tauri-plugin-libmpv-api setup-lib
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # unsigned test build; release.yml signs releases
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: qistara-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
